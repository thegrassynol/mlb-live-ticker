<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MLB Live Ticker</title>
<style>
  :root{
    --bg:#0a0f15;
    --panel:#111923;
    --panel2:#0d141c;
    --line:#2a3440;
    --text:#f7f8fa;
    --muted:#a8b3bf;
    --accent:#d92332;
    --live:#ff4e55;
    --h:128px;
    --speed:90s;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
  }

  .ticker{
    height:var(--h);
    width:100%;
    display:flex;
    background:linear-gradient(180deg,#101720 0%,#0a1016 100%);
    border-top:1px solid #33404e;
    border-bottom:1px solid #06090d;
    color:var(--text);
    overflow:hidden;
  }

  .brand{
    width:124px;
    flex:0 0 124px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#17375c 0%,#17375c 48%,#b21f35 49%,#b21f35 100%);
    border-right:1px solid rgba(255,255,255,.14);
    z-index:4;
  }

  .brand-inner{text-align:center;line-height:1}
  .brand-title{
    font-weight:900;
    font-size:28px;
    letter-spacing:-1px;
  }
  .brand-sub{
    margin-top:8px;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.6px;
  }

  .viewport{
    min-width:0;
    flex:1;
    overflow:hidden;
    position:relative;
  }

  .track{
    height:100%;
    display:flex;
    width:max-content;
    will-change:transform;
    animation:scroll var(--speed) linear infinite;
  }
  .group{display:flex;height:100%}

  @keyframes scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  .item{
    height:100%;
    flex:0 0 auto;
    border-right:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
  }

  .score{
    width:300px;
    padding:10px 12px 8px;
    display:grid;
    grid-template-rows:34px 34px 24px;
    row-gap:2px;
  }

  .team-row{
    display:grid;
    grid-template-columns:30px 48px 1fr 38px;
    align-items:center;
    gap:7px;
    min-height:34px;
  }

  .logo{
    width:28px;
    height:28px;
    object-fit:contain;
  }

  .abbr{
    font-weight:900;
    font-size:19px;
    line-height:1;
  }

  .record{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }

  .runs{
    font-size:23px;
    font-weight:900;
    text-align:right;
    line-height:1;
  }

  .game-meta{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
    border-top:1px solid #222c37;
    padding-top:4px;
    font-size:10px;
    line-height:1;
    font-weight:800;
    color:#cad3dd;
    letter-spacing:.45px;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
  }

  .game-meta span:last-child{
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .live-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--live);
    box-shadow:0 0 6px rgba(255,78,85,.85);
    display:inline-block;
    margin-right:5px;
    vertical-align:1px;
  }

  .status-live{color:#ff8589}
  .status-final{color:#d0d8e1}
  .status-upcoming{color:#8cb9ff}

  .news{
    width:540px;
    padding:12px 18px 11px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    background:linear-gradient(180deg,#121a23 0%,#0c131b 100%);
  }

  .news-kicker{
    flex:0 0 auto;
    color:#f07e85;
    font-weight:900;
    font-size:11px;
    line-height:16px;
    letter-spacing:1.5px;
    margin:0 0 5px 0;
  }

  .news-head{
    flex:0 0 auto;
    font-size:18px;
    line-height:23px;
    font-weight:800;
    margin:0;
    padding:0 0 3px 0;
    min-height:49px;
    max-height:49px;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .news-source{
    flex:0 0 auto;
    margin-top:auto;
    color:var(--muted);
    font-size:10px;
    line-height:14px;
    font-weight:700;
    padding-top:2px;
  }

  .empty,.error{
    display:flex;
    align-items:center;
    padding:0 20px;
    font-weight:800;
  }
  .empty{width:520px;font-size:18px;color:#d5dde6}
  .error{width:600px;font-size:15px;color:#ffd1d1}
</style>
</head>
<body>
<div class="ticker">
  <div class="brand">
    <div class="brand-inner">
      <div class="brand-title">MLB</div>
      <div class="brand-sub">LIVE TICKER</div>
    </div>
  </div>

  <div class="viewport">
    <div class="track" id="track">
      <div class="group" id="groupA"></div>
      <div class="group" id="groupB"></div>
    </div>
  </div>
</div>

<script>
const SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard';
const NEWS = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news?limit=8';

const SCORE_REFRESH_MS = 20000;
const NEWS_REFRESH_MS = 120000;
const MAX_NEWS_ITEMS = 6;

let games = [];
let headlines = [];
let lastScoreFetch = 0;
let lastNewsFetch = 0;

const esc = (s='') => String(s)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;");

function formatRecord(team){
  const r = team?.records?.[0]?.summary;
  return r || '';
}

function gameState(comp){
  const st = comp?.status?.type || {};
  const detail = comp?.status?.type?.shortDetail || comp?.status?.type?.detail || '';
  const state = st.state || '';
  if(state === 'in') return {text: detail || 'LIVE', cls:'status-live', live:true};
  if(state === 'post') return {text: detail || 'FINAL', cls:'status-final', live:false};
  return {text: detail || 'UPCOMING', cls:'status-upcoming', live:false};
}

function scoreCard(event){
  const comp = event?.competitions?.[0];
  if(!comp) return '';

  const teams = [...(comp.competitors || [])].sort((a,b)=>{
    const ao = a.homeAway === 'away' ? 0 : 1;
    const bo = b.homeAway === 'away' ? 0 : 1;
    return ao - bo;
  });

  if(teams.length < 2) return '';

  const meta = gameState(comp);
  const venue = comp?.venue?.fullName || '';

  const rows = teams.map(t=>{
    const team = t.team || {};
    const logo = team.logo || team.logos?.[0]?.href || '';
    const abbr = team.abbreviation || team.shortDisplayName || '';
    const score = t.score ?? '-';
    return `
      <div class="team-row">
        <img class="logo" src="${esc(logo)}" alt="">
        <div class="abbr">${esc(abbr)}</div>
        <div class="record">${esc(formatRecord(t))}</div>
        <div class="runs">${esc(score)}</div>
      </div>`;
  }).join('');

  return `
    <div class="item score">
      ${rows}
      <div class="game-meta">
        <span class="${meta.cls}">${meta.live ? '<span class="live-dot"></span>' : ''}${esc(meta.text)}</span>
        <span>${esc(venue)}</span>
      </div>
    </div>`;
}

function newsCard(article){
  const head = article?.headline || article?.title || '';
  if(!head) return '';
  const source = article?.source || 'ESPN MLB';
  return `
    <div class="item news">
      <div class="news-kicker">MLB NEWS</div>
      <div class="news-head">${esc(head)}</div>
      <div class="news-source">${esc(source)}</div>
    </div>`;
}

function composeItems(){
  const items = [];

  if(games.length){
    games.forEach((g, i)=>{
      items.push(scoreCard(g));
      if((i+1) % 3 === 0 && headlines.length){
        const h = headlines[Math.floor(i/3) % headlines.length];
        items.push(newsCard(h));
      }
    });
  } else {
    items.push(`<div class="item empty">No MLB games are currently listed for today.</div>`);
  }

  if(headlines.length){
    const alreadyInserted = Math.floor(games.length / 3);
    headlines.slice(alreadyInserted, alreadyInserted + 2).forEach(h=>items.push(newsCard(h)));
  }

  return items.filter(Boolean).join('');
}

function render(){
  const a = document.getElementById('groupA');
  const b = document.getElementById('groupB');
  const html = composeItems();
  a.innerHTML = html;
  b.innerHTML = html;

  // Adapt scroll duration to total content width so speed feels consistent.
  requestAnimationFrame(()=>{
    const width = a.scrollWidth;
    const pxPerSecond = 72;
    const seconds = Math.max(35, width / pxPerSecond);
    document.documentElement.style.setProperty('--speed', `${seconds}s`);
  });
}

async function loadScores(){
  try{
    const r = await fetch(`${SCOREBOARD}?_=${Date.now()}`, {cache:'no-store'});
    if(!r.ok) throw new Error(`Scoreboard HTTP ${r.status}`);
    const data = await r.json();
    games = data?.events || [];
    lastScoreFetch = Date.now();
    render();
  }catch(err){
    console.error(err);
    if(!games.length){
      const a = document.getElementById('groupA');
      const b = document.getElementById('groupB');
      const html = `<div class="item error">Unable to load MLB scores right now. Retrying automatically…</div>`;
      a.innerHTML = html; b.innerHTML = html;
    }
  }
}

async function loadNews(){
  try{
    const r = await fetch(`${NEWS}&_=${Date.now()}`, {cache:'no-store'});
    if(!r.ok) throw new Error(`News HTTP ${r.status}`);
    const data = await r.json();
    headlines = (data?.articles || []).slice(0, MAX_NEWS_ITEMS);
    lastNewsFetch = Date.now();
    render();
  }catch(err){
    console.error(err);
  }
}

function refreshLoop(){
  const now = Date.now();
  if(now - lastScoreFetch > SCORE_REFRESH_MS) loadScores();
  if(now - lastNewsFetch > NEWS_REFRESH_MS) loadNews();
}

loadScores();
loadNews();
setInterval(refreshLoop, 5000);
</script>
</body>
</html>
